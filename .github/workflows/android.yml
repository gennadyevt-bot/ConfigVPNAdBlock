name: Config VPN Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: configvpn-debug-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore Config VPN signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64" || { echo 'Missing KEYSTORE_BASE64 repository secret'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/configvpn-release.p12"
      - name: Build signed release APK and AAB
        env:
          UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/configvpn-release.p12
          UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -eu
          test -n "$UPLOAD_STORE_PASSWORD" || { echo 'Missing KEYSTORE_PASSWORD repository secret'; exit 1; }
          test -n "$UPLOAD_KEY_ALIAS" || { echo 'Missing KEY_ALIAS repository secret'; exit 1; }
          bash gradlew assembleRelease bundleRelease lintRelease --no-daemon
      - name: Verify release signatures and APK alignment
        env:
          EXPECTED_CERT_SHA256: 23b17fcb9f9ec1a78cf9eaa18864cdcc16b580750ddc1da57179cdb53791acb0
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -F "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256" apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          jarsigner -verify "$AAB" > aab-signature.txt 2>&1
          grep -F 'jar verified.' aab-signature.txt
          keytool -printcert -jarfile "$AAB" > aab-certificate.txt
          AAB_CERT=$(sed -n 's/.*SHA256: //p' aab-certificate.txt | tr -d ':\r' | tr '[:upper:]' '[:lower:]')
          test "$AAB_CERT" = "$EXPECTED_CERT_SHA256"
          sha256sum "$APK" "$AAB" > SHA256SUMS.txt
      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/configvpn-release.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: configvpn-signed-release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/lint-results-release.*
            apk-signature.txt
            aab-signature.txt
            aab-certificate.txt
            SHA256SUMS.txt
