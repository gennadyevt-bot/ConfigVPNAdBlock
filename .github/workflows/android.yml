name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.7.1'
    - name: Build with Gradle
      run: gradle assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: config-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

  release-aab:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.7.1'
    - name: Decode upload keystore (если задан секрет)
      run: |
        if [ -n "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
        fi
    - name: Build release AAB (для Google Play)
      env:
        UPLOAD_KEYSTORE_PATH: ../upload-keystore.jks
        UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
        UPLOAD_KEY_ALIAS: configvpn-upload
        UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      run: gradle bundleRelease
    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: config-release-aab
        path: app/build/outputs/bundle/release/app-release.aab
