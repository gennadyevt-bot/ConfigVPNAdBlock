name: android
on:
  push:
    branches: [ integration-unified-adblock ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "ndk;26.1.10909125" 2>/dev/null || echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
      - name: Build mitm AAR (gomobile, AdBlock engine beta7)
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          cd mitm && go mod tidy && go test -v -timeout 90s ./... && go get golang.org/x/mobile && gomobile bind -target android/arm64 -androidapi 26 -o mitm.aar .
      - name: Put AAR into app
        run: |
          mkdir -p app/libs
          cp mitm/mitm.aar app/libs/mitm.aar
      - run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify arm64-only APK
        run: |
          python3 - <<'PYAPK'
          import glob, zipfile
          apk, = glob.glob('app/build/outputs/apk/release/*.apk')
          with zipfile.ZipFile(apk) as z:
              abis = {name.split('/')[1] for name in z.namelist() if name.startswith('lib/') and name.endswith('.so')}
          assert abis == {'arm64-v8a'}, f'Unexpected APK ABIs: {abis}'
          print(f'APK native ABIs verified: {sorted(abis)}')
          PYAPK
      - uses: actions/upload-artifact@v4
        with:
          name: cvab-release-apk
          path: app/build/outputs/apk/release/*.apk

  # Публикация APK в Releases: артефакты CI требуют логина GitHub,
  # релизы качаются без него. Перезаписывает pre-release с тем же тегом.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cvab-release-apk
          path: apk
      - name: Publish pre-release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          cd apk
          APK=$(ls *.apk | head -1)
          mv "$APK" "ConfigVPNAdBlock-$VER.apk"
          gh release delete "$VER" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$VER" "ConfigVPNAdBlock-$VER.apk" \
            --title "$VER" --target "${{ github.sha }}" --prerelease \
            --notes "CI build $VER из integration-unified-adblock (${{ github.sha }})"
